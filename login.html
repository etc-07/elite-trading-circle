<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elite Trading Circle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0a0a0a, #1a1a1a); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: rgba(26, 26, 26, 0.9); border: 2px solid #D4AF37; border-radius: 20px; padding: 40px; width: 100%; max-width: 450px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo-icon { width: 80px; height: 80px; margin: 0 auto 15px; border-radius: 15px; object-fit: cover; }
        h1 { text-align: center; background: linear-gradient(135deg, #D4AF37, #FFD700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #D4AF37; font-size: 14px; }
        input { width: 100%; padding: 15px; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 10px; background: rgba(10, 10, 10, 0.6); color: white; font-size: 16px; outline: none; }
        input:focus { border-color: #D4AF37; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1); }
        .btn-login { width: 100%; padding: 15px; background: linear-gradient(135deg, #D4AF37, #FFD700); border: none; border-radius: 10px; color: #0a0a0a; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4); }
        .back-link { text-align: center; margin-top: 20px; color: #d4d4d4; }
        .back-link a { color: #D4AF37; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="Elite Trading Circle" class="logo-icon">
            <h1>Login</h1>
        </div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="nama@email.com" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••" required></div>
            <button type="submit" class="btn-login">Masuk ke Akun</button>
        </form>
        <div class="back-link">Belum punya akun? <a href="register.html">Daftar sekarang</a></div>
        <div class="back-link"><a href="index.html">← Kembali ke beranda</a></div>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const userData = localStorage.getItem('user_' + email);
            if (!userData) { alert('Email tidak terdaftar!'); return; }
            const user = JSON.parse(userData);
            if (user.password !== password) { alert('Password salah!'); return; }
            localStorage.setItem('user', JSON.stringify(user));
            const redirectPage = localStorage.getItem('redirect_after_login');
            if (redirectPage) {
                localStorage.removeItem('redirect_after_login');
                window.location.href = redirectPage;
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
