<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Elite Trading Circle</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: #ffffff; 
            color: #333; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            position: relative;
        }

        /* Background Logo Watermark (Sama seperti index.html) */
        .bg-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background-image: url('logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        /* Login Container */
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 20px; 
            padding: 50px 40px; 
            width: 100%; 
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border-top: 4px solid #D4AF37; /* Aksen gold elegan di atas */
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .logo { text-align: center; margin-bottom: 35px; }
        .logo-icon { 
            width: 90px; 
            height: 90px; 
            margin: 0 auto 20px; 
            border-radius: 16px; 
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
            /* Background putih dihapus - transparan */
        }
        
        h1 { 
            text-align: center; 
            color: #1a1a1a; 
            font-size: 28px; 
            font-weight: 700; 
            margin-bottom: 10px; 
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .form-group { margin-bottom: 22px; }
        
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: #1a1a1a; 
            font-size: 14px; 
            font-weight: 600; 
        }
        
        .form-group input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid #e0e0e0; 
            border-radius: 10px; 
            background: #f8f9fa; 
            color: #1a1a1a; 
            font-size: 15px; 
            outline: none; 
            transition: all 0.3s ease;
        }
        
        .form-group input::placeholder { color: #999; }
        
        .form-group input:focus { 
            border-color: #D4AF37; 
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); 
        }

        .btn-login { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #D4AF37, #FFD700); 
            border: none; 
            border-radius: 10px; 
            color: #1a1a1a; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        
        .btn-login:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5); 
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #999;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        .divider span { padding: 0 15px; }

        .back-link { 
            text-align: center; 
            margin-top: 15px; 
            color: #666; 
            font-size: 14px;
        }
        
        .back-link a { 
            color: #D4AF37; 
            text-decoration: none; 
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .back-link a:hover { 
            color: #B8941F; 
            text-decoration: underline; 
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container { padding: 40px 25px; }
            .logo-icon { width: 70px; height: 70px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <!-- Background Logo Watermark -->
    <div class="bg-logo"></div>

    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="Elite Trading Circle" class="logo-icon">
            <h1>Selamat Datang Kembali</h1>
            <p class="subtitle">Masuk untuk mengakses platform Smart EA</p>
        </div>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" placeholder="nama@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login">Masuk ke Akun</button>
        </form>

        <div class="divider"><span>atau</span></div>

        <div class="back-link">
            Belum punya akun? <a href="register.html">Daftar sekarang</a>
        </div>
        <div class="back-link">
            <a href="index.html">← Kembali ke beranda</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Simulasi loading biar terasa lebih profesional
            const btn = document.querySelector('.btn-login');
            const originalText = btn.innerText;
            btn.innerText = 'Memproses...';
            btn.style.opacity = '0.7';
            btn.disabled = true;

            setTimeout(() => {
                const userData = localStorage.getItem('user_' + email);
                if (!userData) { 
                    alert('Email tidak terdaftar!'); 
                    resetBtn();
                    return; 
                }
                
                const user = JSON.parse(userData);
                if (user.password !== password) { 
                    alert('Password salah!'); 
                    resetBtn();
                    return; 
                }
                
                localStorage.setItem('user', JSON.stringify(user));
                const redirectPage = localStorage.getItem('redirect_after_login');
                
                if (redirectPage) {
                    localStorage.removeItem('redirect_after_login');
                    window.location.href = redirectPage;
                } else {
                    window.location.href = 'dashboard.html';
                }
            }, 800); // Delay 800ms untuk efek smooth
        }

        function resetBtn() {
            const btn = document.querySelector('.btn-login');
            btn.innerText = 'Masuk ke Akun';
            btn.style.opacity = '1';
            btn.disabled = false;
        }
    </script>
</body>
</html>
