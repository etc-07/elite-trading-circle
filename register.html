<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Elite Trading Circle</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0a0a0a, #1a1a1a); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: rgba(26, 26, 26, 0.9); border: 2px solid #D4AF37; border-radius: 20px; padding: 40px; width: 100%; max-width: 450px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo-icon { width: 80px; height: 80px; margin: 0 auto 15px; border-radius: 15px; object-fit: cover; }
        h1 { text-align: center; background: linear-gradient(135deg, #D4AF37, #FFD700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #D4AF37; font-size: 14px; }
        input { width: 100%; padding: 15px; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 10px; background: rgba(10, 10, 10, 0.6); color: white; font-size: 16px; outline: none; }
        input:focus { border-color: #D4AF37; }
        .btn-register { width: 100%; padding: 15px; background: linear-gradient(135deg, #D4AF37, #FFD700); border: none; border-radius: 10px; color: #0a0a0a; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: all 0.3s; }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4); }
        .btn-register:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .back-link { text-align: center; margin-top: 20px; color: #d4d4d4; }
        .back-link a { color: #D4AF37; text-decoration: none; }
        .back-link a:hover { color: #FFD700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="Elite Trading Circle" class="logo-icon">
            <h1>Bergabung Sekarang</h1>
        </div>
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group"><label>Nama Lengkap</label><input type="text" name="nama" id="nama" required></div>
            <div class="form-group"><label>Email</label><input type="email" name="email" id="email" required></div>
            <div class="form-group"><label>No. WhatsApp</label><input type="tel" name="whatsapp" id="whatsapp" required></div>
            
            <!-- PERHATIAN: name="password" DIHAPUS agar tidak terkirim ke Google Sheets -->
            <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
            <div class="form-group"><label>Konfirmasi Password</label><input type="password" id="confirmPassword" required></div>
            
            <button type="submit" class="btn-register" id="btnSubmit">Daftar Gratis</button>
        </form>
        <div class="back-link">Sudah punya akun? <a href="login.html">Login di sini</a></div>
        <div class="back-link"><a href="index.html">← Kembali</a></div>
    </div>
    <script>
        // URL APPS SCRIPT LO
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx3X5m5ExThoJLoxXDychVjpHORL72hcxGJXFMTjqi7l2-IkaD7uszfGX4O9s3RRpGx/exec';

        function handleRegister(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) { 
                alert('Password tidak cocok!'); 
                return; 
            }
            if (password.length < 8) { 
                alert('Password minimal 8 karakter!'); 
                return; 
            }

            // BUAT OBJECT USER DATA (Password tetap disimpan di localStorage untuk login)
            const userData = {
                nama: document.getElementById('nama').value,
                email: document.getElementById('email').value,
                whatsapp: document.getElementById('whatsapp').value,
                password: password,
                registerDate: new Date().toISOString()
            };

            // SIMPAN KE LOCALSTORAGE (BIAR BISA LOGIN)
            localStorage.setItem('user_' + userData.email, JSON.stringify(userData));
            
            // SET LOADING
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = 'Memproses...';

            // KIRIM KE GOOGLE SHEETS (Password TIDAK akan ikut karena tidak ada name="password")
            const form = document.getElementById('registerForm');
            const formData = new FormData(form);
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                alert('Pendaftaran berhasil! Data tersimpan.\n\nSilakan login dengan email dan password Anda.');
                window.location.href = 'login.html';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Terjadi kesalahan koneksi. Silakan coba lagi atau hubungi admin.');
                btn.disabled = false;
                btn.textContent = 'Daftar Gratis';
            });
        }
    </script>
</body>
</html>
