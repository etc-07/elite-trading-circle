<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Elite Trading Circle</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: #ffffff; 
            color: #333; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            position: relative;
        }

        /* Background Logo Watermark */
        .bg-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background-image: url('logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        /* Register Container */
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 20px; 
            padding: 50px 40px; 
            width: 100%; 
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border-top: 4px solid #D4AF37;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .logo { text-align: center; margin-bottom: 35px; }
        .logo-icon { 
            width: 90px; 
            height: 90px; 
            margin: 0 auto 20px; 
            border-radius: 16px; 
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
        }
        
        h1 { 
            text-align: center; 
            color: #1a1a1a; 
            font-size: 28px; 
            font-weight: 700; 
            margin-bottom: 10px; 
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .form-group { margin-bottom: 22px; }
        
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: #1a1a1a; 
            font-size: 14px; 
            font-weight: 600; 
        }
        
        .form-group input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid #e0e0e0; 
            border-radius: 10px; 
            background: #f8f9fa; 
            color: #1a1a1a; 
            font-size: 15px; 
            outline: none; 
            transition: all 0.3s ease;
        }
        
        .form-group input::placeholder { color: #999; }
        
        .form-group input:focus { 
            border-color: #D4AF37; 
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1); 
        }

        .btn-register { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #D4AF37, #FFD700); 
            border: none; 
            border-radius: 10px; 
            color: #1a1a1a; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        
        .btn-register:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5); 
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #999;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        .divider span { padding: 0 15px; }

        .back-link { 
            text-align: center; 
            margin-top: 15px; 
            color: #666; 
            font-size: 14px;
        }
        
        .back-link a { 
            color: #D4AF37; 
            text-decoration: none; 
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .back-link a:hover { 
            color: #B8941F; 
            text-decoration: underline; 
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container { padding: 40px 25px; }
            .logo-icon { width: 70px; height: 70px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <!-- Background Logo Watermark -->
    <div class="bg-logo"></div>

    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="Elite Trading Circle" class="logo-icon">
            <h1>Bergabung Sekarang</h1>
            <p class="subtitle">Daftar gratis untuk akses Smart EA Platform</p>
        </div>
        
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" name="nama" id="nama" placeholder="James Hans" required>
            </div>
            
            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" name="email" id="email" placeholder="nama@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="whatsapp">No. WhatsApp</label>
                <input type="tel" name="whatsapp" id="whatsapp" placeholder="0812345..." required>
            </div>
            
            <!-- PERHATIAN: name="password" DIHAPUS agar tidak terkirim ke Google Sheets -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimal 8 karakter" required>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" placeholder="Ulangi password" required>
            </div>
            
            <button type="submit" class="btn-register" id="btnSubmit">Daftar Gratis</button>
        </form>

        <div class="divider"><span>atau</span></div>

        <div class="back-link">
            Sudah punya akun? <a href="login.html">Login di sini</a>
        </div>
        <div class="back-link">
            <a href="index.html">← Kembali ke beranda</a>
        </div>
    </div>

    <script>
        // URL APPS SCRIPT LO - JANGAN DIUBAH
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx3X5m5ExThoJLoxXDychVjpHORL72hcxGJXFMTjqi7l2-IkaD7uszfGX4O9s3RRpGx/exec';

        function handleRegister(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validasi password
            if (password !== confirmPassword) { 
                alert('Password tidak cocok!'); 
                return; 
            }
            if (password.length < 8) { 
                alert('Password minimal 8 karakter!'); 
                return; 
            }

            // BUAT OBJECT USER DATA (Password tetap disimpan di localStorage untuk login)
            const userData = {
                nama: document.getElementById('nama').value,
                email: document.getElementById('email').value,
                whatsapp: document.getElementById('whatsapp').value,
                password: password,
                registerDate: new Date().toISOString()
            };

            // SIMPAN KE LOCALSTORAGE (BIAR BISA LOGIN)
            localStorage.setItem('user_' + userData.email, JSON.stringify(userData));
            
            // SET LOADING
            const btn = document.getElementById('btnSubmit');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Memproses pendaftaran...';

            // KIRIM KE GOOGLE SHEETS (Password TIDAK akan ikut karena tidak ada name="password")
            const form = document.getElementById('registerForm');
            const formData = new FormData(form);
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                alert('✅ Pendaftaran berhasil!\n\nData Anda tersimpan.\nSilakan login dengan email dan password Anda.');
                window.location.href = 'login.html';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('⚠️ Terjadi kesalahan koneksi.\n\nSilakan coba lagi atau hubungi admin.');
                btn.disabled = false;
                btn.textContent = originalText;
            });
        }
    </script>
</body>
</html>
